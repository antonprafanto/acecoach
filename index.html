<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0A192F" />
    <meta name="description" content="AceCoach — Modern Tennis Pathway. Panduan latihan tenis mandiri berstandar PTR/USPTA dan biomekanik modern." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>AceCoach — Modern Tennis Pathway</title>
  </head>
  <body class="bg-tennis-dark text-slate-100 antialiased selection:bg-tennis-yellow selection:text-tennis-dark min-h-screen">
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
    <script>
      // Register Service Worker for offline PWA capabilities on court
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js').then((reg) => {
            console.log('AceCoach ServiceWorker registered:', reg.scope);
          }).catch((err) => {
            console.log('AceCoach ServiceWorker registration failed:', err);
          });
        });
      }
    </script>
  </body>
</html>
